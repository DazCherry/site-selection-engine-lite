name: Public Lite quality gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model, provider, security and HTTP regression
        run: node --test tests/*.test.mjs
      - name: Publication and history audit
        run: node scripts/publication-check.mjs
